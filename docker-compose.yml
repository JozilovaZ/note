services:
  bot:
    build: .
    container_name: eslatma-bot
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/bot.db
    volumes:
      - bot-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:
